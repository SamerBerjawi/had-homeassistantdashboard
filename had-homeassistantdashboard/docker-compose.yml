version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: had-homeassistantdashboard_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/samerberjawi/had-homeassistantdashboard:0.7.0@sha256:55010c04704a021391dc4ad7e33d45401b5daacfd7f6db74c9c04aef0caa77a8
    restart: on-failure
    stop_grace_period: 30s
    # Image runs as the bundled non-root "node" user (UID/GID 1000)
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data
    environment:
      PORT: 3000
      NODE_ENV: production
