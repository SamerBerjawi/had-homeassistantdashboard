    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Critical viewport CSS, applied before the app stylesheet loads. Kept in a style block
         (not inline style attributes) so the standalone rules below can override it. -->
    <style>
      html { height: 100%; height: 100dvh; width: 100%; background-color: #020617; }
      html:not(.dark) { background-color: #f8fafc; }
      body { margin: 0; padding: 0; width: 100%; background-color: inherit; }
      #root { position: fixed; inset: 0; width: 100%; height: 100%; }
      /* iOS home-screen app bug: at launch, position:fixed/inset:0 and dvh resolve against a
         viewport that excludes the home-indicator strip until the device is rotated, leaving a
         bar at the bottom. In standalone mode the large viewport is the whole screen, so size
         the root from it instead. */
      @media (display-mode: standalone) {
        html, body { height: 100vh; height: 100lvh; }
        #root { bottom: auto; height: 100vh; height: 100lvh; }
      }
    </style>
