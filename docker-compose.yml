services:
  homz-dashboard:
    image: ghcr.io/samerberjawi/had-homeassistantdashboard:latest
    # Uncomment the 'build' line below if you prefer building locally instead of pulling from GitHub Container Registry:
    # build: .
    container_name: homz-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # Persistent storage volume for dashboard config JSON and uploaded vehicle assets
    volumes:
      - ./data:/app/data
    # Optional: Load environment variables from a .env file placed in the same folder
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
