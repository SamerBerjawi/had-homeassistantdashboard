services:
  homz-dashboard:
    image: ghcr.io/samerberjawi/had-homeassistantdashboard:latest
    # Uncomment the 'build' line below if you prefer building locally instead of pulling from GitHub Container Registry:
    # build: .
    container_name: homz-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GO2RTC_URL=http://go2rtc:1984
      # Required: the Home Assistant instance that validates dashboard tokens (SEC-001).
      # Existing installs that already pinned an instance (data/config/ha-instance.json) keep working.
      # Set ALLOW_TOFU_PIN=true only for a one-time first-run pin.
      - HASS_URL=${HASS_URL:-}
    # Persistent storage volume for dashboard config JSON and uploaded vehicle assets
    volumes:
      - ./data:/app/data
    depends_on:
      - go2rtc
    # Optional: Load environment variables from a .env file placed in the same folder
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    # The go2rtc HTTP API (1984) and RTSP (8554) are intentionally NOT published: the dashboard
    # reaches them on the compose network (http://go2rtc:1984). Publishing 1984 exposes an
    # unauthenticated management API to the LAN (SEC-004).
    ports:
      - "8555:8555/tcp"   # WebRTC media transport TCP
      - "8555:8555/udp"   # WebRTC media transport UDP
    volumes:
      - ./data/go2rtc:/config
    environment:
      - GO2RTC_CONFIG=/config/go2rtc.yaml
