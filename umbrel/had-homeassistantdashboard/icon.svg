<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glass Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Smart Home Roof Geometry -->
  <path d="M 140 230 L 256 138 L 372 230" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Bento Grid Cards -->
  <!-- Main Left Card (Living Area) -->
  <rect x="144" y="260" width="102" height="116" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="176" cy="294" r="10" fill="#38bdf8" />
  <rect x="166" y="324" width="58" height="8" rx="4" fill="#ffffff" fill-opacity="0.5" />
  <rect x="166" y="342" width="38" height="8" rx="4" fill="#ffffff" fill-opacity="0.3" />

  <!-- Top Right Card (Thermostat / Sensor) -->
  <rect x="266" y="260" width="102" height="52" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="294" cy="286" r="7" fill="#22c55e" />
  <rect x="312" y="282" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.7" />

  <!-- Bottom Right Card (Lighting / Toggle) -->
  <rect x="266" y="324" width="102" height="52" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="294" cy="350" r="7" fill="#f59e0b" />
  <rect x="312" y="346" width="32" height="8" rx="4" fill="#ffffff" fill-opacity="0.7" />
</svg>
